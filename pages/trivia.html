<body>
<h1>Trivia de Conocimientos Generales</h1>
<h2>1. ¿Cuál es el planeta más grande del sistema solar?</h2>
<input type="radio" name="p1" value="a"> La Tierra<br>
<input type="radio" name="p1" value="b"> Júpiter<br>
<input type="radio" name="p1" value="c"> Marte<br>
<h2>2. ¿Cuántos continentes hay en la Tierra?</h2>
<input type="radio" name="p2" value="a"> 5<br>
<input type="radio" name="p2" value="b"> 6<br>
<input type="radio" name="p2" value="c"> 7<br>
<h2>3. ¿Cuál es el océano más grande del mundo?</h2>
<input type="radio" name="p3" value="a"> Atlántico<br>
<input type="radio" name="p3" value="b"> Índico<br>
<input type="radio" name="p3" value="c"> Pacífico<br>
<h2>4. ¿Cuanto mide la torre Eifell?</h2>
<input type="radio" name="p4" value="a"> 330m<br>
<input type="radio" name="p4" value="b"> 200m<br>
<input type="radio" name="p4" value="c"> 910m<br>
<br>
<button id="comprobar" type="button">Comprobar</button>
<button id="reiniciar" type="button">Reiniciar</button>
<p id="resultado"></p>
<script>
document.getElementById("comprobar").addEventListener("click", function() {
let puntaje = 0;
let p1 = document.querySelector('input[name="p1"]:checked');
let p2 = document.querySelector('input[name="p2"]:checked');
let p3 = document.querySelector('input[name="p3"]:checked');
let p4 = document.querySelector('input[name="p4"]:checked');
if (!p1 || !p2 || !p3 || !p4) {
document.getElementById("resultado").innerHTML =
"Debes responder las tres preguntas.";
return;
}
// Respuestas correctas
if (p1.value === "b") puntaje++;
if (p2.value === "c") puntaje++;
if (p3.value === "c") puntaje++;
if (p4.value === "a") puntaje++;
let mensaje = "<h3>Resultado: " + puntaje + "/4 puntos</h3>";
if (puntaje === 4) {
mensaje += "¡Felicitaciones! Has respondido correctamente todas las preguntas.";
} else if (puntaje === 3) {
mensaje += "Buen intento. Solo te equivocaste en una pregunta.";
} else {
mensaje += "Te invito a intentarlo nuevamente.";
}
document.getElementById("resultado").innerHTML = mensaje;
});
document.getElementById("reiniciar").addEventListener("click", function() {
let opciones = document.querySelectorAll('input[type="radio"]');
for (let opcion of opciones) {
opcion.checked = false;
}
document.getElementById("resultado").innerHTML = "";
});
</script>
</body>
